{{ define "main" }}
<div class="container reading-column">
  <header style="margin-bottom: var(--spacing-lg); padding-bottom: var(--spacing-md); border-bottom: 1px solid var(--border-subtle);">
    <h1 style="margin: 0 0 0.5rem 0;">{{ .Title }}</h1>
    <p style="font-size: 1.15rem; color: var(--text-muted); margin: 0; font-style: italic;">
      Pesquisa local e instantânea em títulos, resumos e conteúdos dos artigos.
    </p>
  </header>

  <div class="search-container">
    <div class="search-input-wrapper">
      <span class="search-icon-inside" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input
        type="search"
        id="search-query-input"
        class="search-input"
        placeholder="Digite um termo, tema ou palavra-chave..."
        aria-label="Pesquisar artigos do blog"
        autofocus
      />
    </div>

    <div id="search-status" class="search-status" aria-live="polite">
      Comece a digitar para pesquisar em todos os artigos.
    </div>

    <ul id="search-results" class="search-results-list" aria-label="Resultados da pesquisa"></ul>
  </div>
</div>
{{ end }}
